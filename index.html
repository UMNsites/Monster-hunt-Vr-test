<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Hunt VR — Test Scene 0.1</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;font-family:Arial,sans-serif}
    #panel{position:fixed;z-index:5;top:12px;left:12px;right:12px;max-width:440px;padding:12px 14px;color:#fff;background:#111827eF;border:1px solid #713044;border-radius:12px}
    #panel strong{color:#ff6b91} #panel small{display:block;margin-top:5px;line-height:1.35;color:#d1d5db}
    a-scene{height:100%;width:100%}
  </style>
</head>
<body>
<div id="panel">
  <strong>MONSTER HUNT VR — TEST SCENE 0.2</strong>
  <small>Gorilla-style arm movement: push your hands against the floor or arena walls to move. Grab the yellow block with a controller trigger, move it, then release to throw it. Quest Browser: press Enter VR.</small>
</div>

<a-scene
  renderer="colorManagement: true; physicallyCorrectLights: true"
  background="color: #08090d"
  vr-mode-ui="enabled: true"
  device-orientation-permission-ui="enabled: true"
  shadow="type: pcfsoft"
>
  <a-assets>
    <a-mixin id="darkwall" material="color: #20232c; roughness: 0.92"></a-mixin>
  </a-assets>

  <!-- Night-time test arena -->
  <a-plane rotation="-90 0 0" width="36" height="36" color="#34323a"
           material="roughness:0.95" position="0 0 0"></a-plane>
  <a-plane rotation="-90 0 0" width="36" height="36" color="#5d1828"
           material="transparent:true; opacity:0.13" position="0 0.012 0"></a-plane>

  <a-box position="0 3 -12" width="36" height="6" depth="0.5" mixin="darkwall"></a-box>
  <a-box position="0 3 12" width="36" height="6" depth="0.5" mixin="darkwall"></a-box>
  <a-box position="-18 3 0" width="0.5" height="6" depth="24" mixin="darkwall"></a-box>
  <a-box position="18 3 0" width="0.5" height="6" depth="24" mixin="darkwall"></a-box>

  <!-- Pillars and overhead lights -->
  <a-box position="-7 2 -5" width="1.2" height="4" depth="1.2" color="#292c35"></a-box>
  <a-box position="7 2 -5" width="1.2" height="4" depth="1.2" color="#292c35"></a-box>
  <a-box position="-7 2 5" width="1.2" height="4" depth="1.2" color="#292c35"></a-box>
  <a-box position="7 2 5" width="1.2" height="4" depth="1.2" color="#292c35"></a-box>
  <a-plane position="0 5.8 -7" rotation="0 0 0" width="5" height="0.15"
           material="color:#fff0d2; emissive:#fff0d2; emissiveIntensity:2"></a-plane>
  <a-light type="point" position="0 5 -7" intensity="1.7" color="#ffd8c4" distance="22"></a-light>
  <a-light type="point" position="0 4 2" intensity="0.8" color="#ff244f" distance="15"></a-light>
  <a-light type="ambient" intensity="0.45" color="#9ca3af"></a-light>

  <!-- Original placeholder monster: pink fur is represented by a bright textured-looking silhouette -->
  <a-entity id="monster" position="0 0 -5">
    <!-- legs -->
    <a-cylinder position="-0.55 0.68 0" radius="0.34" height="1.35" color="#e91e78"></a-cylinder>
    <a-cylinder position="0.55 0.68 0" radius="0.34" height="1.35" color="#e91e78"></a-cylinder>
    <!-- body and belly -->
    <a-sphere position="0 1.95 0" radius="1.05" scale="1 1.25 0.72" color="#f02083"></a-sphere>
    <a-sphere position="0 1.9 0.58" radius="0.66" scale="1 1.12 0.18" color="#77747a"></a-sphere>
    <!-- head and muzzle -->
    <a-sphere position="0 3.45 0" radius="0.93" scale="1.05 1.03 0.78" color="#ed1680"></a-sphere>
    <a-sphere position="0 3.25 0.62" radius="0.52" scale="1.2 0.78 0.42" color="#77747a"></a-sphere>
    <a-box position="0 3.02 0.94" width="0.7" height="0.12" depth="0.12" color="#260d16"></a-box>
    <!-- fixed bloodshot eyes -->
    <a-sphere position="-0.37 3.62 0.68" radius="0.24" color="#fff1ec"></a-sphere>
    <a-sphere position="0.37 3.62 0.68" radius="0.24" color="#fff1ec"></a-sphere>
    <a-torus position="-0.37 3.62 0.88" radius="0.20" radius-tubular="0.025" color="#b10f32"></a-torus>
    <a-torus position="0.37 3.62 0.88" radius="0.20" radius-tubular="0.025" color="#b10f32"></a-torus>
    <!-- cap -->
    <a-sphere position="0 4.27 0" radius="0.5" scale="1 0.32 0.8" color="#e52524"></a-sphere>
    <a-box position="0 4.16 0.38" width="1.05" height="0.08" depth="0.55" color="#f5c21b"></a-box>
    <!-- arms: bright red emissive sleeves -->
    <a-entity position="-1.15 2.45 0">
      <a-cylinder rotation="0 0 58" position="-0.42 -0.05 0" radius="0.28" height="1.45"
        material="color:#8e102c; emissive:#ff092e; emissiveIntensity:1.5"></a-cylinder>
      <a-sphere position="-0.93 -0.43 0.08" radius="0.34" color="#7d2635"></a-sphere>
      <a-light type="point" position="-0.5 0 0" color="#ff103b" intensity="0.7" distance="3"></a-light>
    </a-entity>
    <a-entity position="1.15 2.45 0">
      <a-cylinder rotation="0 0 -58" position="0.42 -0.05 0" radius="0.28" height="1.45"
        material="color:#8e102c; emissive:#ff092e; emissiveIntensity:1.5"></a-cylinder>
      <a-sphere position="0.93 -0.43 0.08" radius="0.34" color="#7d2635"></a-sphere>
      <a-light type="point" position="0.5 0 0" color="#ff103b" intensity="0.7" distance="3"></a-light>
    </a-entity>
  </a-entity>

  <!-- Grabbable test cube for checking controller interaction -->
  <a-box id="testCube" class="grabbable" position="1.2 1.2 -2.2" depth="0.42" height="0.42" width="0.42"
         material="color:#ffcb36; emissive:#ff8c00; emissiveIntensity:0.8"></a-box>
  <a-text value="GRAB TEST" position="0.55 1.72 -2.2" color="#ffe7a3" width="3"></a-text>
  <a-text value="MONSTER HUNT VR  /  TEST ARENA" position="-4 0.04 -11.7" rotation="-90 0 0"
          color="#ffffff" width="8"></a-text>

  <!-- Player rig. Physical room movement works in headset; WASD is for flat preview. -->
  <a-entity id="rig" position="0 0 3" wasd-controls>
    <a-camera position="0 1.6 0" look-controls>
      <a-cursor raycaster="objects: .grabbable" fuse="false" color="#ffdf65"></a-cursor>
    </a-camera>
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .grabbable; far: 8"
              grabber="hand: left">
      <a-sphere radius="0.105" color="#f3a1b9" material="roughness:0.85"></a-sphere>
      <a-cylinder class="armMesh" radius="0.075" height="1" color="#e91e78" material="roughness:0.9"></a-cylinder>
    </a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .grabbable; far: 8"
              grabber="hand: right">
      <a-sphere radius="0.105" color="#f3a1b9" material="roughness:0.85"></a-sphere>
      <a-cylinder class="armMesh" radius="0.075" height="1" color="#e91e78" material="roughness:0.9"></a-cylinder>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  // Simple, lightweight physics for the test block: gravity, floor/wall bounce and throwing.
  AFRAME.registerComponent('block-physics', {
    schema: { gravity: {default: 9.8}, bounce: {default: 0.48} },
    init: function () {
      this.velocity = new THREE.Vector3();
      this.heldBy = null;
      this.lastPosition = new THREE.Vector3();
      this.el.object3D.position.set(1.2, 1.2, -2.2);
    },
    tick: function (time, dt) {
      if (this.heldBy) return;
      const step = Math.min((dt || 0) / 1000, 0.04);
      const o = this.el.object3D;
      this.velocity.y -= this.data.gravity * step;
      o.position.addScaledVector(this.velocity, step);
      const half = 0.21;
      if (o.position.y < half) { o.position.y = half; this.velocity.y = Math.abs(this.velocity.y) * this.data.bounce; this.velocity.x *= 0.88; this.velocity.z *= 0.88; }
      if (o.position.x < -17.5 + half || o.position.x > 17.5 - half) { o.position.x = THREE.MathUtils.clamp(o.position.x, -17.5 + half, 17.5 - half); this.velocity.x *= -this.data.bounce; }
      if (o.position.z < -11.5 + half || o.position.z > 11.5 - half) { o.position.z = THREE.MathUtils.clamp(o.position.z, -11.5 + half, 11.5 - half); this.velocity.z *= -this.data.bounce; }
      this.velocity.multiplyScalar(Math.pow(0.995, step * 60));
      o.rotation.x += this.velocity.z * step * 0.5;
      o.rotation.z -= this.velocity.x * step * 0.5;
    }
  });

  // Controller hands become long arms. Pressing a hand against a surface pushes the player
  // in the opposite direction, giving a basic Gorilla-Tag-inspired locomotion test.
  AFRAME.registerComponent('gorilla-arms', {
    init: function () {
      this.hands = [document.querySelector('#leftHand'), document.querySelector('#rightHand')];
      this.previous = [new THREE.Vector3(), new THREE.Vector3()];
      this.ready = [false, false];
      this.shoulders = [new THREE.Vector3(-0.24, 1.28, 0), new THREE.Vector3(0.24, 1.28, 0)];
      this.tmp = new THREE.Vector3();
      this.down = new THREE.Vector3(0, -1, 0);
      this.ray = new THREE.Raycaster();
    },
    tick: function () {
      const rig = this.el.object3D;
      const scene = this.el.sceneEl.object3D;
      this.hands.forEach((hand, i) => {
        if (!hand || !hand.object3D.visible) return;
        const handWorld = new THREE.Vector3();
        hand.object3D.getWorldPosition(handWorld);
        const arm = hand.querySelector('.armMesh');
        const shoulder = this.shoulders[i].clone();
        this.el.object3D.localToWorld(shoulder);
        const mid = shoulder.clone().add(handWorld).multiplyScalar(0.5);
        const delta = handWorld.clone().sub(shoulder);
        arm.object3D.position.copy(hand.object3D.worldToLocal(mid));
        arm.object3D.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), delta.clone().normalize());
        arm.object3D.scale.y = Math.max(0.25, delta.length());
        if (this.ready[i]) {
          const movement = handWorld.clone().sub(this.previous[i]);
          const floorContact = handWorld.y < 0.22;
          const wallContact = Math.abs(handWorld.x) > 17.35 || Math.abs(handWorld.z) > 11.35;
          // Only push when a hand is actually against an arena surface.
          if (floorContact || wallContact) {
            rig.position.x -= movement.x;
            rig.position.z -= movement.z;
            if (floorContact && movement.y < 0) rig.position.y -= movement.y;
          }
        }
        this.previous[i].copy(handWorld);
        this.ready[i] = true;
      });
    }
  });

  AFRAME.registerComponent('grabber', {
    schema: {hand: {default: 'right'}},
    init: function () {
      this.held = null;
      this.previousHand = new THREE.Vector3();
      this.handVelocity = new THREE.Vector3();
      this.lastTime = 0;
      this.el.addEventListener('triggerdown', () => {
        if (this.held) { this.release(); return; }
        const ray = this.el.components.raycaster;
        if (!ray || !ray.intersections.length) return;
        const hit = ray.intersections.find(x => x.object.el && x.object.el.classList.contains('grabbable'));
        if (!hit) return;
        this.held = hit.object.el;
        const physics = this.held.components['block-physics'];
        if (physics) physics.heldBy = this.el;
        this.el.object3D.attach(this.held.object3D);
        this.held.object3D.position.set(0, 0, -0.45);
        this.held.object3D.rotation.set(0, 0, 0);
      });
      this.el.addEventListener('gripdown', () => { if (this.held) this.release(); });
    },
    tick: function (time) {
      const pos = new THREE.Vector3(); this.el.object3D.getWorldPosition(pos);
      if (this.lastTime) {
        const dt = Math.max(0.001, Math.min((time - this.lastTime) / 1000, 0.05));
        this.handVelocity.copy(pos).sub(this.previousHand).multiplyScalar(1 / dt);
      }
      this.previousHand.copy(pos); this.lastTime = time;
    },
    release: function () {
      const obj = this.held;
      if (!obj) return;
      this.el.sceneEl.object3D.attach(obj.object3D);
      const physics = obj.components['block-physics'];
      if (physics) { physics.heldBy = null; physics.velocity.copy(this.handVelocity).multiplyScalar(1.15); }
      this.held = null;
    }
  });
  document.querySelector('#testCube').setAttribute('block-physics', '');
  document.querySelector('#rig').setAttribute('gorilla-arms', '');
</script>
</body>
</html>
